title = "SafePaste additional detectors"

# These are gaps in the vendored Gitleaks set as it applies to a *clipboard*
# rather than a repository. Anything upstream already covers is deliberately
# absent — duplicating a rule costs scan time and double-reports one secret.
#
# Schema is exactly Gitleaks', plus two optional SafePaste keys:
#   category = one of api_keys tokens passwords private_keys
#                     connection_strings jwts high_entropy
#   enabled     = false is an ABSOLUTE veto, for silencing a rule you disagree
#                 with. It wins even if the rule's category is switched on.
#   default_off = true ships a rule inactive but switchable; naming its
#                 category in Preferences turns it on.
#
# Drop your own file in ~/.config/safepaste/rules/*.toml using this same schema.
# A rule there reusing an existing id replaces it, so upstream rules can be
# retuned without editing the vendored copy.

[allowlist]
description = "clipboard-specific noise"
regexes = [
    # Obvious placeholders. Kept anchored so they only fire on the whole secret,
    # never as a substring of a real key.
    '''(?i)^(?:changeme|change_me|placeholder|redacted|hidden|removed)$''',
    '''(?i)^(?:your|my|the)[_-]?(?:api)?[_-]?(?:key|token|secret|password)$''',
    '''(?i)^(?:x{4,}|y{4,}|z{4,}|\*{4,}|\.{4,}|_{4,}|-{4,}|0{4,})$''',
    '''(?i)^(?:insert|enter|add|paste)[_-]?(?:your)?[_-]?\w{0,20}$''',
    '''(?i)^(?:test|dummy|sample|fake|mock|example)[_-]?\w{0,12}$''',
    '''(?i)^(?:lorem|ipsum|foobar|foo|bar|baz|qux)\w{0,12}$''',
    # Values that are plainly a reference to a secret rather than one.
    '''^\$(?:\w+|\{\w+\}|\(\w+\))$''',
    '''^(?:process\.env|os\.environ|ENV)\[?[\w'".\]]+$''',
    '''^<[\w\s-]{1,40}>$''',
    # A pasted git object or UUID is not a credential.
    '''^[0-9a-f]{7,8}$''',
    '''^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$''',
]

# --------------------------------------------------------------------------
# Connection strings with inline credentials.
#
# Upstream has sidekiq-sensitive-url (redis-specific) but nothing general, and a
# database URL is among the most damaging things to paste into a chat window.
# The password group is what gets redacted; scheme, user, host and database all
# survive, which keeps the string recognisable.
# --------------------------------------------------------------------------
[[rules]]
id = "safepaste-database-url-password"
description = "Database connection string with an inline password"
category = "connection_strings"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis(?:s)?|amqps?|clickhouse|cockroachdb|mssql|sqlserver|jdbc:[a-z0-9]+)://[^\s:/@]{1,64}:([^\s/@]{3,256})@'''
keywords = [
    "postgres", "postgresql", "mysql", "mariadb", "mongodb", "redis",
    "amqp", "clickhouse", "cockroachdb", "mssql", "sqlserver", "jdbc:",
]

[[rules]]
id = "safepaste-generic-url-password"
description = "URL with an inline password"
category = "connection_strings"
regex = '''(?i)\b[a-z][a-z0-9+.-]{2,20}://[^\s:/@]{1,64}:([^\s/@]{6,256})@[a-z0-9.-]+'''
keywords = ["://"]
entropy = 2.2
  [[rules.allowlists]]
  # Don't fire on the schemes the more specific rules above already own, nor on
  # the placeholder forms that litter documentation.
  regexes = [
      '''(?i)^(?:password|passwd|pass|secret|token|xxx+|\*+|<[^>]+>)$''',
  ]

# --------------------------------------------------------------------------
# HTTP Authorization headers, as pasted out of browser devtools or a .http file.
# Upstream covers the `curl -H` form only.
# --------------------------------------------------------------------------
[[rules]]
id = "safepaste-authorization-bearer"
description = "HTTP Authorization Bearer token"
category = "tokens"
regex = '''(?i)\bauthorization\s*[:=]\s*["']?bearer\s+([\w\-.~+/]{16,512}=*)'''
keywords = ["authorization"]
entropy = 3.0

[[rules]]
id = "safepaste-authorization-basic"
description = "HTTP Authorization Basic credentials"
category = "passwords"
regex = '''(?i)\bauthorization\s*[:=]\s*["']?basic\s+([A-Za-z0-9+/]{16,512}={0,2})'''
keywords = ["authorization"]
entropy = 3.0

# --------------------------------------------------------------------------
# Cloud session credentials. Upstream's aws-access-token matches the AKIA/ASIA
# *identifier*; the session token beside it is the part that actually grants
# access, and it is what `aws sso login` prints.
# --------------------------------------------------------------------------
[[rules]]
id = "safepaste-aws-session-token"
description = "AWS session token"
category = "tokens"
regex = '''(?i)\b(?:aws_)?session_token\s*[:=]\s*["']?([A-Za-z0-9/+=]{100,})'''
keywords = ["session_token"]
entropy = 4.0

# --------------------------------------------------------------------------
# Kubernetes credentials. kubernetes-secret-yaml upstream targets Secret
# manifests; a kubeconfig is a different shape and is what people actually paste.
# --------------------------------------------------------------------------
[[rules]]
id = "safepaste-kubeconfig-client-key"
description = "kubeconfig client key data"
category = "private_keys"
regex = '''(?i)client-key-data\s*:\s*([A-Za-z0-9+/]{40,}={0,2})'''
keywords = ["client-key-data"]

[[rules]]
id = "safepaste-kubeconfig-token"
description = "kubeconfig user token"
category = "tokens"
regex = '''(?i)^\s{2,}token\s*:\s*["']?([\w\-./+=]{20,})'''
keywords = ["token"]
entropy = 3.5

# --------------------------------------------------------------------------
# Credential files people paste wholesale when debugging.
# --------------------------------------------------------------------------
[[rules]]
id = "safepaste-netrc-password"
description = ".netrc password"
category = "passwords"
regex = '''(?i)\bmachine\s+\S+\s+login\s+\S+\s+password\s+(\S{3,})'''
keywords = ["machine"]

[[rules]]
id = "safepaste-env-password-assignment"
description = "Password assignment"
category = "passwords"
# Anchored to assignment syntax and to a name that *ends* in a password-ish word,
# so `password_reset_url=/foo` and `has_password=true` do not qualify. Entropy is
# set low on purpose: a weak password is still a password, and unlike an API key
# there is no length or charset floor to lean on.
regex = '''(?im)^\s*(?:export\s+)?[\w.\-]{0,40}(?:password|passwd|pwd|secret)\s*[:=]\s*["']?([^\s"'#]{6,128})["']?\s*$'''
keywords = ["password", "passwd", "pwd", "secret"]
entropy = 1.8
  [[rules.allowlists]]
  regexes = [
      '''(?i)^(?:true|false|null|nil|none|undefined|yes|no|on|off|\d{1,4})$''',
      # Values that are themselves a lookup, not a literal.
      '''^[$%]\{?[\w.]+\}?$''',
      '''(?i)^(?:required|optional|unset|empty|todo|tbd|n/?a)$''',
  ]

# --------------------------------------------------------------------------
# OX Security API keys: `ox_` and exactly 36 base64url characters. Upstream has
# no rule for these at all, and leaning on `generic-api-key` is not enough:
# that one only fires when the key sits beside a name it recognises, so
# `OX_API_KEY=ox_...` is caught while the same key pasted on its own -- straight
# out of the console, into a chat window -- was measured as matching nothing
# whatsoever. The only other rule wide enough for it is the opt-in high-entropy
# one, which is off unless asked for.
#
# The length is fixed rather than a range, which cuts both ways and is worth
# knowing. A lookalike of any other length cannot match at all, and neither can
# a key of any other length: if OX ever lengthens these, this rule goes quiet
# rather than degrading. The `{36}` is the thing to revisit that day.
#
# The group holds the whole token, prefix included: `ox_` is part of the
# credential rather than a preamble, so all of it gets replaced. Contrast the
# password rules above, where the group is what keeps `PGPASSWORD=` readable.
#
# What the group is really for is ending the token without `\b`, and that is not
# a stylistic choice. A body may end in `-`, and `-` is not a word character, so
# `...{36}\b` cannot match there: the engine hunts for a boundary, cannot find
# one and gives up. Seven keys in 2000 random ones were missed exactly that way.
# Consuming one non-body character instead (or end-of-text) keeps the token
# itself in group 1 while the delimiter stays outside it -- and it is also what
# stops a 40-character token matching its first 36 and being half-redacted.
[[rules]]
id = "safepaste-ox-api-key"
description = "OX Security API key"
category = "api_keys"
regex = '''\b(ox_[A-Za-z0-9_-]{36})(?:[^A-Za-z0-9_-]|$)'''
keywords = ["ox_"]
# A backstop against low-diversity junk only (`ox_aaaa...`), not the main
# filter. It cannot be the main filter, even at one fixed length: measured over
# 50000 random keys, entropy bottoms out at 4.15, while the worst realistic
# lookalike -- a 36-character lowercase `ox_`-prefixed identifier -- reaches
# 4.21. The ranges overlap, so entropy alone would have to choose between
# missing real keys and firing on identifiers. Nothing real fell below 3.8.
entropy = 3.8
  [[rules.allowlists]]
  # What entropy could not do, case can. A body with no uppercase letter at all
  # is a snake_case identifier or a hex digest, not a key: 36 random base64url
  # characters missing every one of the 26 uppercase letters is about a
  # 1-in-10^7 event, while `ox_runtime_policy_shadow_flags_override` is
  # something a codebase genuinely contains.
  regexes = [
      '''^ox_[a-z0-9_]+$''',
  ]

# --------------------------------------------------------------------------
# Last resort. On real text this is the rule that generates complaints, so it is
# opt-in from Preferences ("High entropy strings").
#
# Use `default_off`, NOT `enabled = false`: the latter is an absolute veto and
# would make the toggle unable to ever turn this on.
# --------------------------------------------------------------------------
[[rules]]
id = "safepaste-high-entropy-string"
description = "High entropy string"
category = "high_entropy"
default_off = true
regex = '''\b([A-Za-z0-9+/_\-]{32,128}={0,2})\b'''
keywords = []
entropy = 4.5
  [[rules.allowlists]]
  regexes = [
      # Hex-only runs are usually digests, not credentials.
      '''(?i)^[0-9a-f]{32,128}$''',
      # Base64 of something structured, e.g. an embedded PNG.
      '''^(?:iVBOR|R0lGOD|/9j/|JVBERi0)''',
  ]
