name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The detection library is deliberately free of any gi/GTK import (only the
  # daemon and ui layers touch those), so the whole test suite runs on a bare
  # runner with nothing but `regex` and pytest. Worth keeping that way: it makes
  # the part that decides whether a secret leaves your machine testable without
  # a desktop.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          # python3-gi alone is not enough: the tray tests need only Gio, but the
          # dialog tests need the GTK4 and libadwaita typelibs. Without them those
          # two skip, and the transient-parent fix would go uncovered here.
          # python3-gi alone is not enough. The tray tests need only Gio, but the
          # dialog tests construct real widgets, which needs the GTK4 and libadwaita
          # typelibs *and* a display -- hence xvfb below. Without all three they
          # skip, and the transient-parent fix would go uncovered here.
          sudo apt-get install -y --no-install-recommends \
            python3-regex python3-pytest python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb

      - name: Run the test suite
        # Under a virtual display so the dialog tests run rather than skip. Harmless
        # for the rest of the suite, which never touches a widget.
        run: xvfb-run -a python3 -m pytest -q -rs

      - name: Fail on any warning
        run: xvfb-run -a python3 -m pytest -q -W error

      - name: Validate the vendored rule set offline
        # Checks the committed gitleaks.toml still matches its recorded digest and
        # that every rule compiles. Deliberately offline: a build that reached out
        # to GitHub for rules could change what gets flagged without a commit.
        run: python3 scripts/fetch-rules.py --check

      - name: Install with pip, the way Homebrew does
        # This exists because the Homebrew job was the *only* thing installing this
        # project with pip, and it found out the hard way that pyproject.toml
        # carried nothing but pytest config: setuptools refuses to guess packages
        # from a flat layout with safepaste/, tests/, scripts/ and packaging/ side
        # by side, so the formula failed at "Getting requirements to build wheel".
        # Five minutes into a macOS job is an expensive place to learn that. Here it
        # takes forty seconds.
        run: |
          set -eux
          python3 -m venv /tmp/pipvenv
          /tmp/pipvenv/bin/pip install --quiet .

          # The rule data is the product, and a wheel without it installs cleanly,
          # runs and finds nothing. Assert the count, not just that the binary runs.
          /tmp/pipvenv/bin/safepaste rules --stats | grep -qE '^total rules: [0-9]{3}$'
          printf 'GITHUB_TOKEN=ghp_A9bC2dE4fG6hJ8kL0mN1pQ3rS5tU7vW9xY1z\n' \
            | /tmp/pipvenv/bin/safepaste redact - 2>/dev/null \
            | grep -qF 'GITHUB_TOKEN=[REDACTED]'
          test -x /tmp/pipvenv/bin/safepaste-daemon

          # PyGObject is not a declared dependency on purpose (it builds against
          # system headers), so this venv has no `gi` -- which makes it the right
          # place to check that the daemon says what to install rather than dumping
          # a ModuleNotFoundError traceback. Exit 3 is that path.
          set +e
          out=$(/tmp/pipvenv/bin/safepaste-daemon 2>&1); status=$?
          set -e
          test "$status" = "3"
          printf '%s\n' "$out" | grep -q 'sudo apt install python3-gi'
          # `grep -qv Traceback` would pass on any multi-line output, since -v is
          # per-line. Negate the whole match instead.
          ! printf '%s\n' "$out" | grep -q 'Traceback'

      - name: Lint the shell we ship
        run: |
          shellcheck --version
          shellcheck -S warning install.sh packaging/build-deb.sh
          # Maintainer scripts are /bin/sh; tell shellcheck so it flags bashisms.
          shellcheck -S warning -s sh packaging/deb/DEBIAN/postinst \
            packaging/deb/DEBIAN/prerm packaging/deb/DEBIAN/postrm

  # ---------------------------------------------------------------------------
  # The macOS backend, on a real Mac.
  #
  # This job exists because the darwin unit tests drive a *fake* NSPasteboard, so
  # they establish that the logic is right and say nothing about whether the
  # PyObjC calls are. Everything else about this project has been verified on real
  # hardware; without this job, the macOS backend would be the one part that never
  # had been.
  #
  # A runner has no interactive GUI session, so the tray and hotkey are out of
  # reach — but NSPasteboard is not focus-gated the way Wayland's clipboard is, so
  # read, write, monitoring and a full redaction round-trip are all testable.
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --break-system-packages \
            regex pyobjc-framework-Cocoa pyobjc-framework-Quartz pytest

      - name: The suite must pass here too
        # Same code, same assertions, different OS. A handful of tests construct
        # the Linux backend and so skip here; anything that *fails* means
        # something in the portable core is not actually portable.
        run: python3 -m pytest -q -rs

      - name: Backend self-check against the real pasteboard
        run: python3 -m safepaste.backend.darwin

      - name: End-to-end against the real pasteboard
        # Exits 77 if it is not actually running on macOS, which would mean this
        # job silently verified nothing — so treat that as a failure here.
        run: |
          set +e
          python3 scripts/verify-darwin.py
          status=$?
          set -e
          if [ "$status" = "77" ]; then
            echo "::error::verify-darwin.py reported it was not on macOS"
            exit 1
          fi
          exit "$status"

      - name: Homebrew formula must be well-formed
        run: |
          set -eux
          # Resource hashes are generated from PyPI, never typed; a stale one fails
          # the install at the download step with nothing useful to say.
          python3 scripts/sync-homebrew-resources.py --check

          # Through a real tap, because `brew audit <path>` is disabled in current
          # Homebrew -- it takes a *name*. That is also closer to how someone would
          # actually install this, so it is the better test anyway.
          brew tap-new --no-git local/safepaste
          cp packaging/homebrew/safepaste.rb \
            "$(brew --repo local/safepaste)/Formula/safepaste.rb"

          # Strict is advisory: it flags house style for the core tap, which a
          # third-party formula need not satisfy. Plain audit is the gate.
          brew audit --formula --strict local/safepaste/safepaste || \
            echo "::notice::brew audit --strict raised advisory findings"
          brew audit --formula local/safepaste/safepaste

      - name: Install from the formula and run its test block
        run: |
          set -eux
          # --HEAD builds the commit under test rather than the last tag, which is
          # the point: a formula that installs v0.3.0 successfully says nothing
          # about whether this branch still installs.
          brew install --HEAD --build-from-source local/safepaste/safepaste
          brew test local/safepaste/safepaste
          # Independently of brew's own test block, from the installed prefix:
          safepaste rules --stats
          printf 'GITHUB_TOKEN=ghp_A9bC2dE4fG6hJ8kL0mN1pQ3rS5tU7vW9xY1z\n' \
            | safepaste redact - 2>/dev/null | grep -q 'GITHUB_TOKEN=\[REDACTED\]'
          test -x "$(brew --prefix)/bin/safepaste-daemon"
          brew uninstall local/safepaste/safepaste

      - name: The CLI works with no desktop at all
        run: |
          set -eux
          python3 -m safepaste rules --stats
          printf 'GITHUB_TOKEN=ghp_A9bC2dE4fG6hJ8kL0mN1pQ3rS5tU7vW9xY1z\n' \
            | python3 -m safepaste redact - 2>/dev/null | grep -q 'GITHUB_TOKEN=\[REDACTED\]'
          # The service dispatcher must pick the polling shell, not the GLib daemon.
          python3 -c "
          import sys
          assert sys.platform == 'darwin', sys.platform
          from safepaste.backend import get_backend
          assert get_backend().name == 'darwin'
          from safepaste.shell import PollingShell
          print('darwin backend and polling shell both resolve')
          "

  # ---------------------------------------------------------------------------
  # The Windows backend, on a real Windows machine.
  #
  # Same reasoning as the macos job: the unit tests drive a fake Win32 clipboard,
  # so they establish the logic and say nothing about the ctypes calls. Here that
  # gap matters more than usual, because the behaviour most likely to be wrong is
  # timing around the clipboard's global exclusive lock — which cannot be settled
  # by reading documentation.
  #
  # A runner has an interactive-enough session for the clipboard; the tray and
  # hotkey are unimplemented anyway (both need a message pump).
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install regex pytest

      - name: The suite must pass here too
        # A handful of tests construct the Linux backend and so skip; anything that
        # *fails* means something in the portable core is not actually portable.
        run: python -m pytest -q -rs

      - name: Backend self-check against the real clipboard
        run: python -m safepaste.backend.windows

      - name: End-to-end against the real clipboard
        shell: bash
        run: |
          set +e
          python scripts/verify-windows.py
          status=$?
          set -e
          if [ "$status" = "77" ]; then
            echo "::error::verify-windows.py reported it was not on Windows"
            exit 1
          fi
          exit "$status"

      - name: Build standalone executables
        run: |
          python -m pip install pyinstaller
          python packaging/windows/build-exe.py --onedir

      - name: The built exe must carry its rules
        shell: bash
        run: |
          set -eux
          exe="dist/windows/safepaste/safepaste.exe"
          test -f "$exe"
          # The failure this guards against is silent: a bundle missing
          # detector/data still starts, still exits zero, and finds nothing. So
          # assert the rule count, not merely that it runs.
          "$exe" rules --stats | tee /tmp/rules.txt
          grep -qE 'total rules: 2[0-9][0-9]' /tmp/rules.txt
          # And that it actually detects, from the frozen bundle.
          printf 'GITHUB_TOKEN=ghp_A9bC2dE4fG6hJ8kL0mN1pQ3rS5tU7vW9xY1z\n' \
            | "$exe" redact - 2>/dev/null | grep -q 'GITHUB_TOKEN=\[REDACTED\]'
          test -f "dist/windows/safepaste-daemon/safepaste-daemon.exe"

      - name: Package the portable archive
        shell: bash
        run: |
          set -eux
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' safepaste/__init__.py)
          mkdir -p dist/artifacts
          # One archive holding both exes, which is the shape Scoop expects.
          staging="dist/windows/safepaste-${version}-win64"
          mkdir -p "$staging"
          cp -r dist/windows/safepaste/. "$staging/"
          cp dist/windows/safepaste-daemon/safepaste-daemon.exe "$staging/" || \
            cp -r dist/windows/safepaste-daemon/. "$staging/"
          cp README.md "$staging/"
          (cd dist/windows && 7z a -tzip "../artifacts/safepaste-${version}-win64.zip" \
            "safepaste-${version}-win64" >/dev/null)
          ls -l dist/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: safepaste-win64
          path: dist/artifacts/*.zip
          if-no-files-found: error

      - name: The CLI works with no desktop at all
        shell: bash
        run: |
          set -eux
          python -m safepaste rules --stats
          printf 'GITHUB_TOKEN=ghp_A9bC2dE4fG6hJ8kL0mN1pQ3rS5tU7vW9xY1z\n' \
            | python -m safepaste redact - 2>/dev/null | grep -q 'GITHUB_TOKEN=\[REDACTED\]'
          python -c "
          import sys
          assert sys.platform == 'win32', sys.platform
          from safepaste.backend import get_backend
          assert get_backend().name == 'windows'
          from safepaste.shell import PollingShell
          from safepaste.config import CONFIG_DIR
          print('windows backend + polling shell resolve; config at', CONFIG_DIR)
          "

  # ---------------------------------------------------------------------------
  # Builds the .deb and then actually installs it, which is the only way to
  # prove the declared Depends resolve on a clean machine — the thing most
  # likely to be wrong and least likely to be noticed locally.
  # ---------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the package
        id: build
        run: |
          ./packaging/build-deb.sh
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' safepaste/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "deb=dist/safepaste_${version}_all.deb" >> "$GITHUB_OUTPUT"

      - name: Inspect the package
        run: |
          deb=dist/safepaste_${{ steps.build.outputs.version }}_all.deb
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - name: Lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian
          # Informational: a few tags (no man page, no changelog) are expected for
          # a package that is not headed for the Debian archive.
          lintian --no-tag-display-limit \
            dist/safepaste_${{ steps.build.outputs.version }}_all.deb || true

      - name: Install it, resolving real dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/safepaste_${{ steps.build.outputs.version }}_all.deb
          dpkg -s safepaste | head -20

      - name: Smoke-test the installed package
        run: |
          set -eux
          # Detection works from the installed location, using the packaged rules.
          safepaste rules --stats
          # A planted secret must be found (exit 1) ...
          printf 'GITHUB_TOKEN=ghp_A9bC2dE4fG6hJ8kL0mN1pQ3rS5tU7vW9xY1z\n' \
            | safepaste scan - && { echo "expected a finding"; exit 1; } || true
          # ... redacted value-only, surrounding text intact ...
          out=$(printf 'keep\nGITHUB_TOKEN=ghp_A9bC2dE4fG6hJ8kL0mN1pQ3rS5tU7vW9xY1z\nkeep\n' \
            | safepaste redact - 2>/dev/null)
          test "$out" = "$(printf 'keep\nGITHUB_TOKEN=[REDACTED]\nkeep')"
          # ... and clean text exits 0.
          printf 'nothing sensitive here\n' | safepaste scan -
          test "$(printf 'hunter2' | safepaste hash)" \
             = "f52fbd32b2b3b86ff88ef6c490628285f482af15ddcb29541f94bcf526a3f6c7"

      - name: Every module imports from the installed package
        run: |
          # No display on a runner, which is fine: importing gi/GTK4 needs no
          # display, only widget construction does. This catches a missing
          # dependency or typelib that the CLI smoke test would not reach.
          python3 - <<'PY'
          import importlib
          mods = [
              "safepaste", "safepaste.cli", "safepaste.app", "safepaste.daemon",
              "safepaste.hotkey", "safepaste.inject", "safepaste.session",
              "safepaste.detector", "safepaste.redactor", "safepaste.config",
              "safepaste.clipboard.monitor", "safepaste.clipboard.writer",
              "safepaste.ui.dialog", "safepaste.ui.prefs", "safepaste.ui.tray",
              # The platform seam, the portable policy, and both shells.
              "safepaste.backend", "safepaste.backend.linux", "safepaste.guard",
              "safepaste.service", "safepaste.shell",
              # Importable on Linux precisely because it defers AppKit; if this
              # ever fails here, the macOS backend has grown an eager import.
              "safepaste.backend.darwin",
          ]
          for m in mods:
              importlib.import_module(m)
          print(f"{len(mods)}/{len(mods)} modules imported")
          PY

      - name: Verify the systemd user unit and desktop entry
        run: |
          # systemd is present on the runner; desktop-file-utils is not.
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          # --user matters: this is a user unit, and verifying it as a system unit
          # reports spurious errors about %h and graphical-session.target.
          systemd-analyze --user verify /usr/lib/systemd/user/safepaste.service
          # Exits non-zero on real errors; "hint" lines alone are a pass.
          desktop-file-validate /usr/share/applications/safepaste.desktop

      - name: Confirm it uninstalls cleanly
        run: |
          sudo apt-get remove -y safepaste
          # User settings must survive removal; the package must never delete them.
          ! test -e /usr/lib/python3/dist-packages/safepaste

      - uses: actions/upload-artifact@v4
        with:
          name: safepaste_${{ steps.build.outputs.version }}_all.deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Tag-driven release. Push a tag and the .deb is attached to it:
  #     git tag v0.1.0 && git push origin v0.1.0
  # ---------------------------------------------------------------------------
  release:
    # Also needs windows/, because the portable archive is a release asset and its
    # sha256 goes into the Scoop manifest.
    needs: [build, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: safepaste_${{ needs.build.outputs.version }}_all.deb
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: safepaste-win64
          path: dist

      - name: Generate package-manager manifests with real hashes
        # The committed manifest and formula are templates; these are the
        # authoritative copies, because only here do the artifacts exist to hash.
        # A wrong hash fails the install at the download step saying nothing useful,
        # so neither is ever written by hand.
        run: |
          set -eux
          version="${GITHUB_REF_NAME#v}"
          zip="dist/safepaste-${version}-win64.zip"
          test -f "$zip"
          zip_sha=$(sha256sum "$zip" | cut -d" " -f1)

          # GitHub generates the source tarball for a tag; the formula builds from it.
          tarball="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          curl -sSL -o /tmp/src.tar.gz "$tarball"
          src_sha=$(sha256sum /tmp/src.tar.gz | cut -d" " -f1)

          python3 - "$version" "$zip_sha" "$src_sha" <<'PYEOF'
          import json, pathlib, re, sys

          version, zip_sha, src_sha = sys.argv[1:4]

          manifest = json.loads(pathlib.Path("packaging/scoop/safepaste.json").read_text())
          manifest["version"] = version
          arch = manifest["architecture"]["64bit"]
          arch["url"] = re.sub(r"/v[^/]+/", f"/v{version}/", arch["url"])
          arch["url"] = re.sub(r"safepaste-[^/]+-win64\.zip", f"safepaste-{version}-win64.zip", arch["url"])
          arch["hash"] = zip_sha
          arch["extract_dir"] = f"safepaste-{version}-win64"
          pathlib.Path("dist/safepaste.json").write_text(json.dumps(manifest, indent=4) + "\n")

          formula = pathlib.Path("packaging/homebrew/safepaste.rb").read_text()
          formula = re.sub(
              r'(url "https://github\.com/[^"]*/archive/refs/tags/)v[^"]*(\.tar\.gz")',
              rf"\g<1>v{version}\g<2>", formula, count=1,
          )
          # Only the first sha256 belongs to the tarball; the rest are resources.
          formula = re.sub(r'(\n  sha256 ")[0-9a-fA-F]{64}(")', rf"\g<1>{src_sha}\g<2>", formula, count=1)
          pathlib.Path("dist/safepaste.rb").write_text(formula)
          print(f"scoop hash   {zip_sha}")
          print(f"formula hash {src_sha}")
          PYEOF
          grep -m1 sha256 dist/safepaste.rb
          python3 -c "import json;d=json.load(open('dist/safepaste.json'));print(d['version'], d['architecture']['64bit']['hash'])"

      - name: Warn if the tag and __version__ disagree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="${{ needs.build.outputs.version }}"
          if [ "$tag" != "$pkg" ]; then
            echo "::warning::tag $GITHUB_REF_NAME does not match __version__ $pkg"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Notes go via a file rather than a heredoc: gh accepts only one of
          # --notes/--notes-file/--generate-notes, and a heredoc nested in a YAML
          # block scalar is easy to break with a stray indent.
          {
            echo '## Linux (Debian/Ubuntu)'
            echo
            echo '    sudo apt install ./safepaste_*_all.deb'
            echo '    systemctl --user start safepaste.service'
            echo '    python3 -m safepaste.hotkey install    # binds Ctrl+Alt+V'
            echo
            echo '## macOS'
            echo
            echo '    brew tap amigoun/safepaste https://github.com/amigoun/safepaste-linux'
            echo '    brew install safepaste'
            echo '    brew services start safepaste'
            echo
            echo 'Builds from source, so no notarised binary and no Apple'
            echo 'Developer subscription is involved.'
            echo
            echo '## Windows'
            echo
            echo '    scoop install https://github.com/amigoun/safepaste-linux/releases/download/'"$GITHUB_REF_NAME"'/safepaste.json'
            echo
            echo 'Or download safepaste-*-win64.zip and run safepaste-daemon.exe.'
            echo 'The executables are unsigned, so SmartScreen may warn on first run.'
            echo
            echo '## Verification'
            echo
            echo 'Linux is checked live on a real desktop; macOS and Windows against'
            echo 'their real clipboard APIs on CI runners. See the README for what'
            echo 'each platform can and cannot do -- notably that per-application'
            echo 'policy works on macOS and Windows but not on GNOME.'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            dist/*.deb dist/*.zip dist/safepaste.json dist/safepaste.rb \
            --repo "$GITHUB_REPOSITORY" \
            --title "SafePaste $GITHUB_REF_NAME" \
            --notes-file notes.md
